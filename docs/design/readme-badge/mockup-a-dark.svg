    <text x="252" y="112" font-size="10" letter-spacing="2" fill="#64748b">COST</text>
    <text x="252" y="146" font-size="20" font-weight="700" fill="#f8fafc">$616</text>

    <text x="352" y="112" font-size="10" letter-spacing="2" fill="#64748b">RANK</text>
