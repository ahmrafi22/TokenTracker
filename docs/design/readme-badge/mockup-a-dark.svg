    <rect x="498" y="131" width="58" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="498" y="131" width="15" height="5" rx="2.5" fill="#34d399" fill-opacity="0.65"/>

    <text x="440" y="154" font-size="10.5" fill="#94a3b8">Hermes</text>
    <text x="492" y="154" font-size="10.5" fill="#cbd5e1" text-anchor="end">13%</text>
