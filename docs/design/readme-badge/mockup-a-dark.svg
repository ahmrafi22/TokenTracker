    <text x="492" y="120" font-size="10.5" fill="#cbd5e1" text-anchor="end">60%</text>
    <rect x="498" y="114" width="58" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="498" y="114" width="35" height="5" rx="2.5" fill="#34d399"/>

    <text x="440" y="137" font-size="10.5" fill="#94a3b8">Codex</text>
