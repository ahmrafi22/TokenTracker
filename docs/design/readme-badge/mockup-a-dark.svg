<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="Rafi Ahmed on TokenTracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="600" height="180" rx="16" fill="url(#bg)" stroke="#1e2a44"/>
  <rect width="600" height="180" rx="16" fill="url(#glow)"/>

  <g transform="translate(44 54)">
    <circle r="24" fill="url(#av)"/>
    <text x="0" y="0" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#064e3b">R</text>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="48" font-size="21" font-weight="700" fill="#f8fafc">Rafi Ahmed</text>
    <text x="80" y="67" font-size="11.5" fill="#94a3b8">TokenTracker · All-time usage</text>
    <text x="572" y="40" font-size="11" fill="#64748b" text-anchor="end">www.tokentracker.cc</text>

    <line x1="232" y1="98" x2="232" y2="152" stroke="#1e293b"/>
    <line x1="332" y1="98" x2="332" y2="152" stroke="#1e293b"/>

    <text x="80" y="112" font-size="10" letter-spacing="2" fill="#64748b">TOKENS</text>
